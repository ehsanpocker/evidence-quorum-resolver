[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-quorum-resolver"
version = "0.1.0"
description = "Standalone multi-source claim resolution primitive for GenLayer"
requires-python = ">=3.12"
dependencies = ["genlayer-test>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "genvm-linter"]
sim = ["genlayer-test[sim]>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests/direct"]
addopts = "-ra"
